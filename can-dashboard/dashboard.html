<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAN Live Dashboard</title>
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --surface2: #1e1e24;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #e8e8ed;
    --muted: #8a8a9a;
    --dim: #55555f;
    --accent: #4f8ef7;
    --accent-dim: rgba(79,142,247,0.15);
    --green: #34c77b;
    --green-dim: rgba(52,199,123,0.15);
    --amber: #f0a028;
    --amber-dim: rgba(240,160,40,0.12);
    --red: #e8504a;
    --channel-colors: #4f8ef7, #a78bfa, #34c77b, #f0a028, #e8504a, #38bdf8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    gap: 12px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: -0.2px;
    flex-shrink: 0;
  }
  .logo-icon {
    width: 28px; height: 28px;
    background: var(--accent);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
  }
  .logo-icon svg { width: 16px; height: 16px; fill: white; }
  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--dim);
    transition: background 0.3s;
    flex-shrink: 0;
  }
  .status-dot.live { background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 2s infinite; }
  .status-dot.error { background: var(--red); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .status-text { font-size: 12px; color: var(--muted); }
  #msg-rate { font-size: 12px; color: var(--muted); padding: 3px 8px; background: var(--surface2); border-radius: 20px; }

  /* Search */
  .search-bar {
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .search-bar input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 7px 12px;
    color: var(--text);
    font-size: 13px;
    outline: none;
  }
  .search-bar input:focus { border-color: var(--accent); }
  .search-bar input::placeholder { color: var(--dim); }
  .btn-small {
    padding: 6px 12px;
    border-radius: 7px;
    border: 1px solid var(--border2);
    background: var(--surface2);
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.15s, border-color 0.15s;
  }
  .btn-small:hover { color: var(--text); border-color: var(--accent); }
  .btn-small.active { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }

  /* Channel tabs */
  #channel-tabs {
    display: flex;
    gap: 0;
    padding: 0 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  #channel-tabs::-webkit-scrollbar { display: none; }
  .ch-tab {
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    white-space: nowrap;
    user-select: none;
  }
  .ch-tab:hover { color: var(--text); }
  .ch-tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .ch-tab .ch-count {
    display: inline-block;
    margin-left: 6px;
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 10px;
    background: var(--surface2);
    color: var(--dim);
  }

  /* Main content */
  #content { padding: 12px 16px; max-width: 900px; margin: 0 auto; }

  /* Message groups */
  .msg-group {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
    overflow: hidden;
    transition: opacity 0.2s;
  }
  .msg-group.hidden { opacity: 0.35; }
  .msg-group.filtered { display: none; }

  .msg-header {
    display: flex;
    align-items: center;
    padding: 10px 14px;
    cursor: pointer;
    gap: 10px;
    user-select: none;
    transition: background 0.15s;
  }
  .msg-header:hover { background: var(--surface2); }

  .msg-toggle {
    width: 36px; height: 20px;
    border-radius: 10px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    position: relative;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.2s, border-color 0.2s;
  }
  .msg-toggle.on { background: var(--green); border-color: var(--green); }
  .msg-toggle::after {
    content: '';
    position: absolute;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: white;
    top: 2px; left: 2px;
    transition: transform 0.2s;
  }
  .msg-toggle.on::after { transform: translateX(16px); }

  .msg-id {
    font-family: "SF Mono", "Fira Code", monospace;
    font-size: 12px;
    color: var(--accent);
    background: var(--accent-dim);
    padding: 2px 7px;
    border-radius: 5px;
    flex-shrink: 0;
  }
  .msg-name {
    font-weight: 500;
    font-size: 13px;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .msg-chevron {
    color: var(--dim);
    font-size: 16px;
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .msg-group.collapsed .msg-chevron { transform: rotate(-90deg); }

  /* Signal rows */
  .signals-table {
    border-top: 1px solid var(--border);
  }
  .msg-group.collapsed .signals-table { display: none; }

  .signal-row {
    display: flex;
    align-items: center;
    padding: 8px 14px 8px 50px;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s, opacity 0.2s;
  }
  .signal-row:last-child { border-bottom: none; }
  .signal-row:hover { background: var(--surface2); }
  .signal-row.hidden { opacity: 0.35; }

  .sig-toggle {
    width: 28px; height: 16px;
    border-radius: 8px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    position: relative;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.2s, border-color 0.2s;
  }
  .sig-toggle.on { background: var(--accent); border-color: var(--accent); }
  .sig-toggle::after {
    content: '';
    position: absolute;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: white;
    top: 2px; left: 2px;
    transition: transform 0.2s;
  }
  .sig-toggle.on::after { transform: translateX(12px); }

  .sig-name {
    flex: 1;
    color: var(--muted);
    font-size: 13px;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sig-value {
    font-family: "SF Mono", "Fira Code", monospace;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    text-align: right;
    min-width: 80px;
    transition: color 0.3s;
  }
  .sig-value.flash { color: var(--green); }
  .sig-unit {
    font-size: 11px;
    color: var(--dim);
    min-width: 32px;
    text-align: left;
  }
  .sig-bar-wrap {
    width: 60px;
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .sig-bar {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    width: 0%;
    transition: width 0.3s;
  }

  /* Empty states */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--dim);
  }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty h3 { font-size: 16px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
  .empty p { font-size: 13px; line-height: 1.6; }
  code { background: var(--surface2); padding: 1px 5px; border-radius: 4px; font-family: monospace; }

  /* Stats bar */
  #stats-bar {
    display: flex;
    gap: 16px;
    padding: 8px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
    overflow-x: auto;
    scrollbar-width: none;
  }
  #stats-bar::-webkit-scrollbar { display: none; }
  .stat { white-space: nowrap; }
  .stat span { color: var(--text); font-weight: 500; }

  /* Responsive */
  @media (max-width: 500px) {
    .sig-bar-wrap { display: none; }
    .search-bar { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
      </svg>
    </div>
    CAN Dashboard
  </div>
  <div class="header-right">
    <div id="msg-rate">— msg/s</div>
    <div class="status-dot" id="status-dot"></div>
    <div class="status-text" id="status-text">Connecting…</div>
  </div>
</header>

<div id="stats-bar">
  <div class="stat">Channels: <span id="s-channels">0</span></div>
  <div class="stat">Messages: <span id="s-messages">0</span></div>
  <div class="stat">Signals: <span id="s-signals">0</span></div>
  <div class="stat">Last update: <span id="s-lastupdate">—</span></div>
</div>

<div class="search-bar">
  <input type="search" id="search" placeholder="Search messages or signals…" autocomplete="off" />
  <button class="btn-small" id="btn-all-on">All on</button>
  <button class="btn-small" id="btn-all-off">All off</button>
  <button class="btn-small" id="btn-collapse">Collapse all</button>
</div>

<div id="channel-tabs"></div>

<div id="content">
  <div class="empty" id="empty-state">
    <div class="empty-icon">📡</div>
    <h3>Waiting for CAN data…</h3>
    <p>Start your logger and pipe it to the server:<br><br>
    <code>your-can-logger | node server.js</code><br><br>
    Data will appear here in real time.</p>
  </div>
</div>

<script>
const WS_URL = `ws://${location.host}`;

// State
let state = {};            // channel -> id -> { name, signals: { name: {value, unit, ts} } }
let activeChannel = null;
let visibilityMsg = {};    // "ch|id" -> bool
let visibilitySig = {};    // "ch|id|sig" -> bool
let collapsed = {};        // "ch|id" -> bool
let msgCount = 0, lastMsgCountTs = Date.now(), msgRate = 0;
let signalMins = {}, signalMaxs = {};

// Throttle DOM updates
let pendingUpdates = new Set();
let rafScheduled = false;

function scheduleRender(key) {
  pendingUpdates.add(key);
  if (!rafScheduled) {
    rafScheduled = true;
    requestAnimationFrame(flushUpdates);
  }
}

function flushUpdates() {
  rafScheduled = false;
  pendingUpdates.forEach(key => renderSignalValue(key));
  pendingUpdates.clear();
}

// WebSocket
let ws, reconnectTimer;
function connect() {
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    setStatus('live', 'Live');
    clearTimeout(reconnectTimer);
  };

  ws.onclose = () => {
    setStatus('error', 'Reconnecting…');
    reconnectTimer = setTimeout(connect, 2000);
  };

  ws.onerror = () => setStatus('error', 'Error');

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'snapshot') {
      state = msg.state;
      rebuildAll();
    } else if (msg.type === 'update') {
      handleUpdate(msg);
    }
  };
}

function setStatus(cls, text) {
  const dot = document.getElementById('status-dot');
  dot.className = 'status-dot ' + cls;
  document.getElementById('status-text').textContent = text;
}

function handleUpdate(msg) {
  const { channel, id, name, signal, value, unit, ts } = msg;
  if (!state[channel]) state[channel] = {};
  if (!state[channel][id]) {
    state[channel][id] = { name, signals: {} };
    ensureMessageRow(channel, id, name);
  }
  state[channel][id].signals[signal] = { value, unit, ts };

  const sigKey = channel + '|' + id + '|' + signal;
  if (!signalMins[sigKey] || value < signalMins[sigKey]) signalMins[sigKey] = value;
  if (!signalMaxs[sigKey] || value > signalMaxs[sigKey]) signalMaxs[sigKey] = value;

  ensureSignalRow(channel, id, signal, unit);
  scheduleRender(sigKey);
  updateStats();

  msgCount++;
  document.getElementById('s-lastupdate').textContent = new Date().toLocaleTimeString();
}

// --- Build DOM ---
function rebuildAll() {
  buildChannelTabs();
  if (activeChannel === null && Object.keys(state).length > 0) {
    activeChannel = Object.keys(state)[0];
  }
  renderChannel();
  updateStats();
}

function buildChannelTabs() {
  const tabs = document.getElementById('channel-tabs');
  const channels = Object.keys(state);
  if (channels.length === 0) return;

  // Preserve active channel
  if (!activeChannel || !state[activeChannel]) {
    activeChannel = channels[0];
  }

  tabs.innerHTML = '';
  channels.forEach((ch, i) => {
    const count = Object.keys(state[ch] || {}).length;
    const tab = document.createElement('div');
    tab.className = 'ch-tab' + (ch === activeChannel ? ' active' : '');
    tab.dataset.ch = ch;
    tab.innerHTML = ch + `<span class="ch-count">${count}</span>`;
    tab.onclick = () => { activeChannel = ch; buildChannelTabs(); renderChannel(); };
    tabs.appendChild(tab);
  });
}

function renderChannel() {
  const content = document.getElementById('content');
  const empty = document.getElementById('empty-state');
  const channels = Object.keys(state);

  if (channels.length === 0) {
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  if (!activeChannel || !state[activeChannel]) activeChannel = channels[0];

  const ch = activeChannel;
  const msgs = state[ch] || {};

  // Remove message groups not in this channel
  Array.from(content.querySelectorAll('.msg-group')).forEach(el => el.remove());

  Object.entries(msgs).forEach(([id, msgData]) => {
    createMessageGroup(ch, id, msgData);
  });

  applySearch();
}

function createMessageGroup(ch, id, msgData) {
  const content = document.getElementById('content');
  const groupKey = ch + '|' + id;
  if (document.getElementById('mg-' + CSS.escape(groupKey))) return;

  const group = document.createElement('div');
  group.className = 'msg-group';
  group.id = 'mg-' + groupKey;

  const isOn = visibilityMsg[groupKey] !== false;

  group.innerHTML = `
    <div class="msg-header" onclick="toggleCollapse('${escJ(groupKey)}')">
      <div class="msg-toggle ${isOn ? 'on' : ''}" id="mt-${escId(groupKey)}" onclick="event.stopPropagation();toggleMsg('${escJ(groupKey)}')"></div>
      <span class="msg-id">${id}</span>
      <span class="msg-name">${msgData.name}</span>
      <span class="msg-chevron">›</span>
    </div>
    <div class="signals-table" id="st-${escId(groupKey)}"></div>
  `;
  content.appendChild(group);

  if (collapsed[groupKey]) group.classList.add('collapsed');
  if (!isOn) group.classList.add('hidden');

  Object.entries(msgData.signals).forEach(([sig, sigData]) => {
    addSignalRow(group.querySelector('.signals-table'), ch, id, sig, sigData.unit);
    const sigKey = ch + '|' + id + '|' + sig;
    if (!signalMins[sigKey]) signalMins[sigKey] = sigData.value;
    if (!signalMaxs[sigKey]) signalMaxs[sigKey] = sigData.value;
    renderSignalValue(sigKey);
  });
}

function ensureMessageRow(ch, id, name) {
  const groupKey = ch + '|' + id;
  if (ch !== activeChannel) return;
  if (document.getElementById('mg-' + CSS.escape(groupKey))) return;
  const msgData = state[ch][id];
  createMessageGroup(ch, id, msgData);
  buildChannelTabs();
}

function ensureSignalRow(ch, id, signal, unit) {
  const groupKey = ch + '|' + id;
  if (ch !== activeChannel) return;
  const st = document.getElementById('st-' + escId(groupKey));
  if (!st) return;
  const sigKey = ch + '|' + id + '|' + signal;
  if (document.getElementById('sr-' + escId(sigKey))) return;
  addSignalRow(st, ch, id, signal, unit);
}

function addSignalRow(container, ch, id, sig, unit) {
  const sigKey = ch + '|' + id + '|' + sig;
  const isOn = visibilitySig[sigKey] !== false;

  const row = document.createElement('div');
  row.className = 'signal-row' + (isOn ? '' : ' hidden');
  row.id = 'sr-' + escId(sigKey);
  row.innerHTML = `
    <div class="sig-toggle ${isOn ? 'on' : ''}" id="sigt-${escId(sigKey)}" onclick="toggleSig('${escJ(sigKey)}')"></div>
    <span class="sig-name">${sig}</span>
    <div class="sig-bar-wrap"><div class="sig-bar" id="bar-${escId(sigKey)}"></div></div>
    <span class="sig-value" id="sv-${escId(sigKey)}">—</span>
    <span class="sig-unit">${unit}</span>
  `;
  container.appendChild(row);
}

function renderSignalValue(sigKey) {
  const parts = sigKey.split('|');
  const [ch, id, sig] = parts;
  const sigData = state[ch]?.[id]?.signals?.[sig];
  if (!sigData) return;

  const el = document.getElementById('sv-' + escId(sigKey));
  const bar = document.getElementById('bar-' + escId(sigKey));
  if (!el) return;

  const v = sigData.value;
  const disp = typeof v === 'number'
    ? (Number.isInteger(v) ? v : parseFloat(v.toFixed(4)))
    : v;
  el.textContent = disp;

  // Flash animation
  el.classList.remove('flash');
  void el.offsetWidth;
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 400);

  // Mini bar (percent of seen range)
  if (bar) {
    const min = signalMins[sigKey] ?? v;
    const max = signalMaxs[sigKey] ?? v;
    const range = max - min;
    const pct = range === 0 ? 50 : Math.min(100, Math.max(0, ((v - min) / range) * 100));
    bar.style.width = pct + '%';
  }
}

// --- Toggles ---
function toggleMsg(groupKey) {
  const cur = visibilityMsg[groupKey] !== false;
  visibilityMsg[groupKey] = !cur;
  const group = document.getElementById('mg-' + CSS.escape(groupKey));
  const toggle = document.getElementById('mt-' + escId(groupKey));
  if (group) group.classList.toggle('hidden', cur);
  if (toggle) toggle.classList.toggle('on', !cur);
}

function toggleSig(sigKey) {
  const cur = visibilitySig[sigKey] !== false;
  visibilitySig[sigKey] = !cur;
  const row = document.getElementById('sr-' + escId(sigKey));
  const toggle = document.getElementById('sigt-' + escId(sigKey));
  if (row) row.classList.toggle('hidden', cur);
  if (toggle) toggle.classList.toggle('on', !cur);
}

function toggleCollapse(groupKey) {
  const group = document.getElementById('mg-' + CSS.escape(groupKey));
  if (!group) return;
  const col = !group.classList.contains('collapsed');
  collapsed[groupKey] = col;
  group.classList.toggle('collapsed', col);
}

// --- Global controls ---
document.getElementById('btn-all-on').onclick = () => {
  document.querySelectorAll('.msg-toggle').forEach(t => { t.classList.add('on'); t.closest('.msg-group')?.classList.remove('hidden'); });
  document.querySelectorAll('.sig-toggle').forEach(t => { t.classList.add('on'); t.closest('.signal-row')?.classList.remove('hidden'); });
  Object.keys(visibilityMsg).forEach(k => visibilityMsg[k] = true);
  Object.keys(visibilitySig).forEach(k => visibilitySig[k] = true);
};
document.getElementById('btn-all-off').onclick = () => {
  document.querySelectorAll('.msg-toggle').forEach(t => { t.classList.remove('on'); t.closest('.msg-group')?.classList.add('hidden'); });
  document.querySelectorAll('.sig-toggle').forEach(t => { t.classList.remove('on'); t.closest('.signal-row')?.classList.add('hidden'); });
  Object.keys(visibilityMsg).forEach(k => visibilityMsg[k] = false);
  Object.keys(visibilitySig).forEach(k => visibilitySig[k] = false);
};
document.getElementById('btn-collapse').onclick = () => {
  const allCollapsed = document.querySelectorAll('.msg-group:not(.collapsed)').length === 0;
  document.querySelectorAll('.msg-group').forEach(g => {
    const key = g.id.replace('mg-', '');
    g.classList.toggle('collapsed', !allCollapsed);
    collapsed[key] = !allCollapsed;
  });
  document.getElementById('btn-collapse').textContent = allCollapsed ? 'Collapse all' : 'Expand all';
};

// --- Search ---
document.getElementById('search').addEventListener('input', applySearch);
function applySearch() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  document.querySelectorAll('.msg-group').forEach(group => {
    if (!q) { group.classList.remove('filtered'); return; }
    const name = group.querySelector('.msg-name')?.textContent.toLowerCase() || '';
    const id = group.querySelector('.msg-id')?.textContent.toLowerCase() || '';
    const sigs = Array.from(group.querySelectorAll('.sig-name')).map(s => s.textContent.toLowerCase());
    const match = name.includes(q) || id.includes(q) || sigs.some(s => s.includes(q));
    group.classList.toggle('filtered', !match);
  });
}

// --- Stats ---
function updateStats() {
  const channels = Object.keys(state);
  document.getElementById('s-channels').textContent = channels.length;
  let msgs = 0, sigs = 0;
  channels.forEach(ch => {
    const m = Object.keys(state[ch] || {});
    msgs += m.length;
    m.forEach(id => sigs += Object.keys(state[ch][id].signals || {}).length);
  });
  document.getElementById('s-messages').textContent = msgs;
  document.getElementById('s-signals').textContent = sigs;
}

// Message rate counter
setInterval(() => {
  const now = Date.now();
  const elapsed = (now - lastMsgCountTs) / 1000;
  msgRate = Math.round(msgCount / elapsed);
  document.getElementById('msg-rate').textContent = msgRate + ' msg/s';
  msgCount = 0;
  lastMsgCountTs = now;
}, 2000);

// --- Helpers ---
function escJ(s) { return s.replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
function escId(s) { return s.replace(/[^a-zA-Z0-9]/g, '_'); }

// --- Init ---
connect();

// Fetch current state on load (fallback if WS snapshot missed)
fetch('/state').then(r => r.json()).then(s => {
  if (Object.keys(state).length === 0 && Object.keys(s).length > 0) {
    state = s;
    rebuildAll();
  }
}).catch(() => {});
</script>
